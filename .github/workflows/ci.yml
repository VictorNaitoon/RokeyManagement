      #   if: vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != ''
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      #     service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      #
      # - name: Set up Cloud SDK
      #   if: vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != ''
      #   uses: google-github-actions/setup-gcloud@v2
      #
      # - name: Configure Docker for Artifact Registry
      #   if: vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != ''
      #   run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      #
      # - name: Build and push (Artifact Registry)
      #   if: vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != ''
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ${{ matrix.context }}
      #     file: ${{ matrix.dockerfile }}
      #     push: true
      #     tags: |
      #       ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ matrix.image_suffix }}:${{ github.sha }}
      #       ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ matrix.image_suffix }}:latest
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3) Deploy placeholder — solo en push a main (opt-in real con Cloud Run)
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Permisos extra si usás WIF para GCP
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Deploy placeholder
        run: echo "Deploy to Cloud Run pending Terraform — workflow verde sin secrets GCP."

      # ---------------------------------------------------------------------
      # DEPLOY REAL A CLOUD RUN (descomentar cuando Terraform + secrets listos)
      # Requiere: GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
      #           GCP_SERVICE_ACCOUNT, y que las imágenes estén en Artifact
      #           Registry o GHCR accesible desde Cloud Run.
